image:
  repository: docker.io/rook/ceph
  tag: v1.20.7@sha256:2f970c4256179d56fa9f7867a634701f533103908c4e2ad43cf3954c1f7e33f9
  pullPolicy: IfNotPresent

crds:
  enabled: true

allowLoopDevices: true
enableDiscoveryDaemon: false
logLevel: INFO

csi:
  installCsiOperator: true
  enableRbdDriver: false
  enableCephfsDriver: false
  enableNFSDriver: false

ceph-csi-operator:
  controllerManager:
    manager:
      image:
        repository: quay.io/cephcsi/ceph-csi-operator
        tag: v1.0.4@sha256:c62933fd4083635f969f8a61932af45dba9902d48867e2b5d98a69d8e4344eb6

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
