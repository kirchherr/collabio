apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-default-deny-ingress
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-authorized-clients
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: collabio-provider-tests
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rgw-authorized-clients
  namespace: rook-ceph
spec:
  podSelector:
    matchLabels:
      app: rook-ceph-rgw
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: collabio-provider-tests
      ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
