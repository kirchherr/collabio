apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: collabio-provider-local-block
  labels:
    app.kubernetes.io/part-of: collabio-provider-stack
    collabio.io/environment: development
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: collabio-provider-osd-0
  labels:
    app.kubernetes.io/part-of: collabio-provider-stack
    collabio.io/environment: development
spec:
  capacity:
    storage: 8Gi
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: collabio-provider-local-block
  local:
    path: /dev/collabio-provider-osd
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-collabio-provider-server-0
---
