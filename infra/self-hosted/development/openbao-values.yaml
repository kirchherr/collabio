global:
  enabled: true
  tlsDisable: false

injector:
  enabled: false

server:
  enabled: true
  configAnnotation: true
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: "2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641"
    pullPolicy: IfNotPresent
  updateStrategyType: OnDelete
  logLevel: warn
  logFormat: json
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  ingress:
    enabled: false
  service:
    enabled: true
    type: ClusterIP
    active:
      enabled: true
    standby:
      enabled: true
  dataStorage:
    enabled: true
    size: 2Gi
    mountPath: /openbao/data
    accessMode: ReadWriteOnce
    storageClass: openbao-independent-rwo
  auditStorage:
    enabled: true
    size: 2Gi
    mountPath: /openbao/audit
    accessMode: ReadWriteOnce
    storageClass: openbao-independent-rwo
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumes:
    - name: openbao-tls
      secret:
        secretName: openbao-server-tls
        defaultMode: 0440
  volumeMounts:
    - name: openbao-tls
      mountPath: /openbao/tls
      readOnly: true
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
    port: 8200
    failureThreshold: 12
  livenessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
    port: 8200
  terminationGracePeriodSeconds: 30
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
          topologyKey: kubernetes.io/hostname
  networkPolicy:
    enabled: false
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  dev:
    enabled: false
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        cluster_name = "collabio-openbao-development"

        audit "file" "audit-primary" {
          description = "Primary Collabio OpenBao audit trail."
          options {
            file_path = "/openbao/audit/audit-primary.log"
            mode = "0600"
            format = "json"
            hmac_accessor = "true"
            log_raw = "false"
          }
        }

        audit "file" "audit-secondary" {
          description = "Secondary Collabio OpenBao audit trail."
          options {
            file_path = "/openbao/audit/audit-secondary.log"
            mode = "0600"
            format = "json"
            hmac_accessor = "true"
            log_raw = "false"
          }
        }

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 0
          tls_cert_file = "/openbao/tls/tls.crt"
          tls_key_file = "/openbao/tls/tls.key"
          tls_client_ca_file = "/openbao/tls/ca.crt"
          tls_min_version = "tls12"
        }

        storage "raft" {
          path = "/openbao/data"
          retry_join {
            leader_api_addr = "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200"
            leader_tls_servername = "openbao.openbao.svc.cluster.local"
            leader_ca_cert_file = "/openbao/tls/ca.crt"
            leader_client_cert_file = "/openbao/tls/tls.crt"
            leader_client_key_file = "/openbao/tls/tls.key"
          }
        }

        service_registration "kubernetes" {}

ui:
  enabled: false

csi:
  enabled: false

snapshotAgent:
  enabled: false
