apiVersion: v1
kind: ServiceAccount
metadata:
  name: collabio-provider-protocol-probe
  namespace: collabio-provider-tests
  labels:
    app.kubernetes.io/name: collabio-provider-protocol-probe
    app.kubernetes.io/part-of: collabio-provider-stack
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collabio-provider-protocol-probe
  namespace: collabio-provider-tests
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: collabio-provider-protocol-probe
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
      ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: collabio-provider-protocol-probe
  namespace: collabio-provider-tests
  labels:
    app.kubernetes.io/name: collabio-provider-protocol-probe
    app.kubernetes.io/part-of: collabio-provider-stack
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabio-provider-protocol-probe
        app.kubernetes.io/part-of: collabio-provider-stack
    spec:
      serviceAccountName: collabio-provider-protocol-probe
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protocol-probe
          image: collabio-provider-protocol-probe:development
          imagePullPolicy: Never
          command:
            - python
            - -m
            - suite.operations.self_hosted_provider_protocol_probe
          env:
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_ENABLED
              value: "1"
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_STATUS_FILE
              value: /input/provider-development-status.json
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_EXPECTED_STATUS_SHA256
              valueFrom:
                configMapKeyRef:
                  name: collabio-provider-protocol-probe-input
                  key: expected-status-sha256
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_RUNTIME_IMAGE_ID
              valueFrom:
                configMapKeyRef:
                  name: collabio-provider-protocol-probe-input
                  key: runtime-image-id
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_CA_FILE
              value: /run/secrets/provider/ca.crt
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_S3_ACCESS_KEY_FILE
              value: /run/secrets/provider/s3-access-key
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_S3_SECRET_KEY_FILE
              value: /run/secrets/provider/s3-secret-key
            - name: SUITE_SELF_HOSTED_PROVIDER_PROTOCOL_PROBE_OPENBAO_TOKEN_FILE
              value: /run/secrets/provider/openbao-token
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: provider-credentials
              mountPath: /run/secrets/provider
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: input
          configMap:
            name: collabio-provider-protocol-probe-input
            defaultMode: 0440
            items:
              - key: provider-development-status.json
                path: provider-development-status.json
        - name: provider-credentials
          secret:
            secretName: collabio-provider-protocol-probe-credentials
            defaultMode: 0440
        - name: runtime-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
