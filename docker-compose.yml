services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    environment:
      POSTGRES_DB: collabio
      POSTGRES_USER: collabio_owner
      POSTGRES_PASSWORD: collabio_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabio_owner -d collabio"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-collabio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  object-storage-profile-check:
    build:
      context: .
      target: dev
    profiles: ["object-storage"]
    command: python -m suite.storage.s3_provider_profile_check
    depends_on:
      - minio
    environment:
      PYTHONPATH: /workspace/app
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-collabio-minio}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-object-storage
      SUITE_S3_BOOTSTRAP_BUCKETS: "1"
      SUITE_S3_PROFILE_CHECK_RETRIES: "30"
    volumes:
      - ./app:/workspace/app
      - ./docs:/workspace/docs:ro

  migrate:
    build:
      context: .
      target: dev
    command: python -m suite.persistence.migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_MIGRATION_DATABASE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKER_DATABASE_DSN: postgresql://collabio_worker:collabio_worker@postgres:5432/collabio
      SUITE_AUDIT_DATABASE_DSN: postgresql://collabio_audit_writer:collabio_audit_writer@postgres:5432/collabio
      SUITE_AUTHZ_ADMIN_DATABASE_DSN: postgresql://collabio_authz_admin:collabio_authz_admin@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app

  backup:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: collabio_owner
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      mkdir -p /backups;
      ts=$$(date -u +%Y%m%dT%H%M%SZ);
      file=/backups/collabio-$${ts}.dump;
      pg_dump -h postgres -U collabio_owner -d collabio -Fc -f $${file};
      sha256sum $${file} > $${file}.sha256;
      echo Created $${file}"
    volumes:
      - ./backups:/backups

  backup-verify:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      latest=$$(ls -1t /backups/*.dump | head -n 1);
      sha256sum -c $${latest}.sha256;
      pg_restore --list $${latest} > /dev/null;
      echo Verified $${latest}"
    volumes:
      - ./backups:/backups

  rich-document-parser:
    build:
      context: .
      target: dev
    command: python -m suite.rag.rich_document_parser_service --describe
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro

  legacy-sql-metadata-worker:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_server_metadata
    network_mode: "none"
    read_only: true
    cap_drop:
