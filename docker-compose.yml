services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /workspace/app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests

  test:
    build: .
    command: pytest -q
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests

