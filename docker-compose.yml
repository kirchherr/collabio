services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    environment:
      POSTGRES_DB: collabio
      POSTGRES_USER: collabio_owner
      POSTGRES_PASSWORD: collabio_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabio_owner -d collabio"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  postgres-test:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    environment:
      POSTGRES_DB: collabio_test
      POSTGRES_USER: collabio_owner
      POSTGRES_PASSWORD: collabio_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabio_owner -d collabio_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres18_test_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  postgres-restore:
    profiles: ["restore-drill"]
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    environment:
      POSTGRES_DB: collabio_restore
      POSTGRES_USER: collabio_owner
      POSTGRES_PASSWORD: collabio_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabio_owner -d collabio_restore"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_POSTGRES_RESTORE_PORT:-55433}:5432"
    volumes:
      - postgres18_restore_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-collabio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
    ports:
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_MINIO_API_PORT:-29000}:9000"
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio_data:/data

  minio-restore:
    profiles: ["restore-drill"]
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_RESTORE_ROOT_USER:-collabio-restore}
      MINIO_ROOT_PASSWORD: ${MINIO_RESTORE_ROOT_PASSWORD:-collabio-restore-secret}
    ports:
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_MINIO_RESTORE_API_PORT:-29100}:9000"
      - "${SUITE_BIND_ADDRESS:-127.0.0.1}:${SUITE_MINIO_RESTORE_CONSOLE_PORT:-29101}:9001"
    volumes:
      - minio_restore_data:/data


  object-storage-profile-check:
    build:
      context: .
      target: dev
    command: python -m suite.storage.s3_provider_profile_check
    depends_on:
      - minio
    environment:
      PYTHONPATH: /workspace/app
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-collabio-minio}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-object-storage
      SUITE_S3_BOOTSTRAP_BUCKETS: "1"
      SUITE_S3_PROFILE_CHECK_RETRIES: "30"
    volumes:
      - ./app:/workspace/app
      - ./docs:/workspace/docs:ro

  object-storage-restore-profile-check:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.storage.s3_provider_profile_check
    depends_on:
      - minio-restore
    environment:
      PYTHONPATH: /workspace/app
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio-restore:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_RESTORE_ROOT_USER:-collabio-restore}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_RESTORE_ROOT_PASSWORD:-collabio-restore-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio-restore-target
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-restore-target
      SUITE_S3_BOOTSTRAP_BUCKETS: "1"
      SUITE_S3_PROFILE_CHECK_RETRIES: "30"
    volumes:
      - ./app:/workspace/app
      - ./docs:/workspace/docs:ro

  source-object-runtime-bootstrap:
    build:
      context: .
      target: dev
    command: python -m suite.storage.persistent_source_object_runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage-profile-check:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_ENV: dev
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_BACKEND: postgres
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKSPACE_SOURCE_OBJECT_CONTENT_STORE_BACKEND: s3-compatible
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_RETENTION_POLICY_PATH: /workspace/docs/retention_manifest_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-collabio-minio}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-object-storage
      SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO: ${SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO:-1}
      SUITE_SOURCE_OBJECT_RUNTIME_TENANT_IDS: ${SUITE_SOURCE_OBJECT_RUNTIME_TENANT_IDS:-tenant-demo,tenant-other}
      SUITE_SOURCE_OBJECT_RUNTIME_RESTORE_DRILL_REPORT_HASH: ${SUITE_SOURCE_OBJECT_RUNTIME_RESTORE_DRILL_REPORT_HASH:-sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee}
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  crm-runtime-bootstrap:
    build:
      context: .
      target: dev
    command: python -m suite.platform.crm_runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_ENV: dev
      SUITE_CRM_REPOSITORY_BACKEND: postgres
      SUITE_CRM_REPOSITORY_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_CRM_RUNTIME_SEED_DEMO: ${SUITE_CRM_RUNTIME_SEED_DEMO:-1}
    volumes:
      - ./app:/workspace/app:ro

  backend-storage-foundation-gate:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.storage.backend_storage_foundation_gate
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      source-object-runtime-bootstrap:
        condition: service_completed_successfully
      object-storage-restore-profile-check:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_ENV: dev
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_BACKEND: postgres
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKSPACE_SOURCE_OBJECT_CONTENT_STORE_BACKEND: s3-compatible
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_RETENTION_POLICY_PATH: /workspace/docs/retention_manifest_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-collabio-minio}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-object-storage
      SUITE_RESTORE_S3_ENDPOINT_URL: http://minio-restore:9000
      SUITE_RESTORE_S3_ACCESS_KEY_ID: ${MINIO_RESTORE_ROOT_USER:-collabio-restore}
      SUITE_RESTORE_S3_SECRET_ACCESS_KEY: ${MINIO_RESTORE_ROOT_PASSWORD:-collabio-restore-secret}
      SUITE_RESTORE_S3_REGION: us-east-1
      SUITE_RESTORE_S3_STORAGE_PROVIDER: minio-restore-target
      SUITE_RESTORE_S3_PROVIDER_PROFILE_ID: minio-compose-restore-target
      SUITE_RESTORE_S3_PROFILE_CHECK_RETRIES: "30"
      SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO: ${SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO:-1}
      SUITE_SOURCE_OBJECT_RESTORE_DRILL_TENANT_IDS: ${SUITE_SOURCE_OBJECT_RUNTIME_TENANT_IDS:-tenant-demo,tenant-other}
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  migrate:
    build:
      context: .
      target: dev
    command: python -m suite.persistence.migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_MIGRATION_DATABASE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKER_DATABASE_DSN: postgresql://collabio_worker:collabio_worker@postgres:5432/collabio
      SUITE_AUDIT_DATABASE_DSN: postgresql://collabio_audit_writer:collabio_audit_writer@postgres:5432/collabio
      SUITE_AUTHZ_ADMIN_DATABASE_DSN: postgresql://collabio_authz_admin:collabio_authz_admin@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app

  backup:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    depends_on:
      source-object-runtime-bootstrap:
        condition: service_completed_successfully
      crm-runtime-bootstrap:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: collabio_owner
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      mkdir -p /backups;
      ts=$$(date -u +%Y%m%dT%H%M%SZ);
      file=/backups/collabio-$${ts}.dump;
      pg_dump -h postgres -U collabio_owner -d collabio -Fc -f $${file};
      sha256sum $${file} > $${file}.sha256;
      echo Created $${file}"
    volumes:
      - ./backups:/backups

  backup-verify:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    depends_on:
      backup:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      latest=$$(ls -1t /backups/*.dump | head -n 1);
      sha256sum -c $${latest}.sha256;
      pg_restore --list $${latest} > /dev/null;
      echo Verified $${latest}"
    volumes:
      - ./backups:/backups

  postgres-backup-restore-loader:
    profiles: ["restore-drill"]
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    depends_on:
      backup:
        condition: service_completed_successfully
      postgres-restore:
        condition: service_healthy
    environment:
      PGPASSWORD: collabio_owner
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      latest=$$(ls -1t /backups/*.dump | head -n 1);
      sha256sum -c $${latest}.sha256;
      pg_restore --list $${latest} > /dev/null;
      dropdb -h postgres-restore -U collabio_owner --if-exists --force collabio_restore;
      createdb -h postgres-restore -U collabio_owner -O collabio_owner collabio_restore;
      pg_restore -h postgres-restore -U collabio_owner -d collabio_restore --exit-on-error $${latest};
      digest=$$(sha256sum $${latest} | cut -d ' ' -f 1);
      printf 'sha256:%s' $${digest} > /backups/postgres-restore-receipt.sha256.tmp;
      mv /backups/postgres-restore-receipt.sha256.tmp /backups/postgres-restore-receipt.sha256;
      echo Restored $${latest} into isolated PostgreSQL target"
    volumes:
      - ./backups:/backups

  postgres-restore-drill:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.operations.postgres_restore_drill
    depends_on:
      postgres-backup-restore-loader:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_POSTGRES_RESTORE_SOURCE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_POSTGRES_RESTORE_TARGET_DSN: postgresql://collabio_owner:collabio_owner@postgres-restore:5432/collabio_restore
      SUITE_POSTGRES_BACKUP_DIRECTORY: /backups
      SUITE_POSTGRES_RESTORE_RECEIPT_PATH: /backups/postgres-restore-receipt.sha256
    volumes:
      - ./app:/workspace/app:ro
      - ./backups:/backups:ro

  backend-foundation-completion-gate:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.operations.backend_foundation_completion_gate
    depends_on:
      postgres-backup-restore-loader:
        condition: service_completed_successfully
      source-object-runtime-bootstrap:
        condition: service_completed_successfully
      object-storage-restore-profile-check:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_ENV: dev
      SUITE_POSTGRES_RESTORE_SOURCE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_POSTGRES_RESTORE_TARGET_DSN: postgresql://collabio_owner:collabio_owner@postgres-restore:5432/collabio_restore
      SUITE_POSTGRES_BACKUP_DIRECTORY: /backups
      SUITE_POSTGRES_RESTORE_RECEIPT_PATH: /backups/postgres-restore-receipt.sha256
      SUITE_BACKEND_FOUNDATION_GATE_REPORT_PATH: /backups/backend-foundation-completion-gate.json
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_BACKEND: postgres
      SUITE_WORKSPACE_SOURCE_OBJECT_REPOSITORY_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKSPACE_SOURCE_OBJECT_CONTENT_STORE_BACKEND: s3-compatible
      SUITE_STORAGE_POLICY_PATH: /workspace/docs/storage_adapter_policy.json
      SUITE_RETENTION_POLICY_PATH: /workspace/docs/retention_manifest_policy.json
      SUITE_S3_ENDPOINT_URL: http://minio:9000
      SUITE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-collabio-minio}
      SUITE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-collabio-minio-secret}
      SUITE_S3_REGION: us-east-1
      SUITE_S3_STORAGE_PROVIDER: minio
      SUITE_S3_PROVIDER_PROFILE_ID: minio-compose-object-storage
      SUITE_RESTORE_S3_ENDPOINT_URL: http://minio-restore:9000
      SUITE_RESTORE_S3_ACCESS_KEY_ID: ${MINIO_RESTORE_ROOT_USER:-collabio-restore}
      SUITE_RESTORE_S3_SECRET_ACCESS_KEY: ${MINIO_RESTORE_ROOT_PASSWORD:-collabio-restore-secret}
      SUITE_RESTORE_S3_REGION: us-east-1
      SUITE_RESTORE_S3_STORAGE_PROVIDER: minio-restore-target
      SUITE_RESTORE_S3_PROVIDER_PROFILE_ID: minio-compose-restore-target
      SUITE_RESTORE_S3_PROFILE_CHECK_RETRIES: "30"
      SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO: ${SUITE_SOURCE_OBJECT_RUNTIME_SEED_DEMO:-1}
      SUITE_SOURCE_OBJECT_RESTORE_DRILL_TENANT_IDS: ${SUITE_SOURCE_OBJECT_RUNTIME_TENANT_IDS:-tenant-demo,tenant-other}
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro
      - ./backups:/backups

  business-backend-release-gate:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.operations.business_backend_release_gate
    depends_on:
      backend-foundation-completion-gate:
        condition: service_completed_successfully
      api:
        condition: service_started
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_BACKEND_FOUNDATION_GATE_REPORT_PATH: /backups/backend-foundation-completion-gate.json
      SUITE_BUSINESS_BACKEND_RELEASE_GATE_REPORT_PATH: /backups/business-backend-release-gate.json
      SUITE_POSTGRES_RESTORE_SOURCE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_RELEASE_API_BASE_URL: http://api:8000
      SUITE_RELEASE_API_RETRIES: "60"
      SUITE_CRM_ONBOARDING_BACKEND: postgres
      SUITE_TASKS_ACTIVITIES_BACKEND: postgres
      SUITE_TIME_TRACKING_BACKEND: postgres
    volumes:
      - ./app:/workspace/app:ro
      - ./backups:/backups
  productivity-pilot-preflight-gate:
    profiles: ["restore-drill"]
    build:
      context: .
      target: dev
    command: python -m suite.operations.productivity_pilot_preflight
    depends_on:
      business-backend-release-gate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
      SUITE_BUSINESS_BACKEND_RELEASE_GATE_REPORT_PATH: /backups/business-backend-release-gate.json
      SUITE_PRODUCTIVITY_PILOT_POLICY_PATH: /workspace/docs/operations/productivity_pilot_policy.json
      SUITE_PRODUCTIVITY_PILOT_TENANT_IDS: ${SUITE_PRODUCTIVITY_PILOT_TENANT_IDS:-tenant-demo}
      SUITE_PRODUCTIVITY_PILOT_EVIDENCE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_POSTGRES_RESTORE_SOURCE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro
      - ./backups:/backups:ro
  rich-document-parser:
    build:
      context: .
      target: dev
    command: python -m suite.rag.rich_document_parser_service --describe
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro

  legacy-sql-metadata-worker:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_server_metadata
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  legacy-sql-readiness-smoke:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_readiness_smoke --once
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  legacy-sql-import-dry-run-worker:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_import_dry_run_worker --once
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  legacy-sql-import-write-approval-gate-smoke:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_import_write_approval_gate --once
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  legacy-sql-discovery-intake:
    build:
      context: .
      target: dev
    command: python -m suite.platform.legacy_sql_discovery_intake_operations --once
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app:ro
      - ./docs:/workspace/docs:ro

  legacy-sql-evidence-ledger-drill:
    build:
