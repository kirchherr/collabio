services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    environment:
      POSTGRES_DB: collabio
      POSTGRES_USER: collabio_owner
      POSTGRES_PASSWORD: collabio_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabio_owner -d collabio"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  migrate:
    build:
      context: .
      target: dev
    command: python -m suite.persistence.migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_MIGRATION_DATABASE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKER_DATABASE_DSN: postgresql://collabio_worker:collabio_worker@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app

  backup:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: collabio_owner
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      mkdir -p /backups;
      ts=$$(date -u +%Y%m%dT%H%M%SZ);
      file=/backups/collabio-$${ts}.dump;
      pg_dump -h postgres -U collabio_owner -d collabio -Fc -f $${file};
      sha256sum $${file} > $${file}.sha256;
      echo Created $${file}"
    volumes:
      - ./backups:/backups

  backup-verify:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "set -eu;
      latest=$$(ls -1t /backups/*.dump | head -n 1);
      sha256sum -c $${latest}.sha256;
      pg_restore --list $${latest} > /dev/null;
      echo Verified $${latest}"
    volumes:
      - ./backups:/backups

  api:
    build:
      context: .
      target: dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_DATA_DIR: /workspace/data
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./data:/workspace/data

  test:
    build:
      context: .
      target: dev
    command: pytest -q
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_DATA_DIR: /tmp/collabio-test-data
      SUITE_MIGRATION_DATABASE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKER_DATABASE_DSN: postgresql://collabio_worker:collabio_worker@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./docs:/workspace/docs
      - ./pyproject.toml:/workspace/pyproject.toml
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro

  lint:
    build:
      context: .
      target: dev
    command: sh -lc "ruff check . && ruff format --check ."
    environment:
      PYTHONPATH: /workspace/app
      SUITE_DATA_DIR: /tmp/collabio-test-data
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./docs:/workspace/docs
      - ./pyproject.toml:/workspace/pyproject.toml
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro

  typecheck:
    build:
      context: .
      target: dev
    command: mypy app tests
    environment:
      PYTHONPATH: /workspace/app
      SUITE_DATA_DIR: /tmp/collabio-test-data
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml

  quality:
    build:
      context: .
      target: dev
    command: sh -lc "ruff check . && ruff format --check . && mypy app tests && pytest -q"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/app
      SUITE_DATA_DIR: /tmp/collabio-test-data
      SUITE_MIGRATION_DATABASE_DSN: postgresql://collabio_owner:collabio_owner@postgres:5432/collabio
      SUITE_DATABASE_DSN: postgresql://collabio_app:collabio_app@postgres:5432/collabio
      SUITE_WORKER_DATABASE_DSN: postgresql://collabio_worker:collabio_worker@postgres:5432/collabio
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./docs:/workspace/docs
      - ./pyproject.toml:/workspace/pyproject.toml
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro

volumes:
  postgres18_data:
