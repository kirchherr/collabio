services:
  api:
    build:
      context: .
      target: dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /workspace/app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests

  test:
    build:
      context: .
      target: dev
    command: pytest -q
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml

  lint:
    build:
      context: .
      target: dev
    command: sh -lc "ruff check . && ruff format --check ."
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml

  typecheck:
    build:
      context: .
      target: dev
    command: mypy app tests
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml

  quality:
    build:
      context: .
      target: dev
    command: sh -lc "ruff check . && ruff format --check . && mypy app tests && pytest -q"
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml
